['mc','Aktivitas Ekonomi','Mudah',2,'Kegiatan berikut termasuk kegiatan distribusi, kecuali ...',['penyortiran produk','pengangkutan produk','menyimpan stok produk di gudang','membuat pakaian di pabrik garmen'],3],
['mc','Aktivitas Ekonomi','Sedang',2,'Perhatikan kegiatan membeli berikut. Yang termasuk kegiatan konsumsi adalah ...',['Pak Tono membeli tepung untuk dibuat kue lalu dijual lagi','Pabrik membeli kapas untuk dijadikan kain','Dina membeli kue untuk dimakan sendiri','Grosir membeli sembako dari produsen untuk dijual ke warung'],2],
['mc','Aktivitas Ekonomi','Sedang',2,'Pedagang ikan mengirim ikan segar dengan truk berpendingin agar tidak cepat busuk. Hal ini menunjukkan bahwa distribusi dipengaruhi oleh faktor ...',['jumlah produk','luas daerah','sarana komunikasi','sifat produk'],3],
['mc','Lingkungan','Mudah',2,'Petani di lereng bukit membuat sengkedan pada lahan miring. Tujuan utamanya adalah ...',['memperluas lahan pertanian','mencegah erosi dan hanyutnya lapisan tanah yang subur','memudahkan pembuatan irigasi','menambah jumlah pohon di hutan'],1],
['mc','Perdagangan Antarpulau','Sedang',2,'Contoh perdagangan antarpulau yang tepat adalah ...',['cengkih dari Maluku dikirim ke industri di Surabaya','petani Wonosobo menjual kentang ke Semarang','Indonesia mengekspor kopi ke Jepang','Indonesia mengimpor gandum dari Australia'],0],
['mc','Perdagangan Antarpulau','Sedang',2,'Maluku menghasilkan cengkih melimpah, sedangkan industri di Jawa membutuhkannya tetapi tidak cukup menanamnya. Hal ini mendorong perdagangan antarpulau karena adanya ...',['perbedaan faktor produksi atau potensi yang dimiliki tiap daerah','pengaruh waktu','selera konsumen yang sama','jumlah penduduk yang sama'],0],
['mc','Aktivitas Ekonomi','Sedang',2,'Harga beras naik tinggi, sehingga banyak keluarga beralih makan jagung. Permintaan terhadap jagung naik karena faktor ...',['selera konsumen','pengaruh waktu','adanya barang pengganti','tingkat pendapatan'],2],
['mc','Kependudukan','Sedang',2,'Sebuah kota pada tahun 2025 mencatat kelahiran 1.200 orang, kematian 400 orang, penduduk masuk 300 orang, dan penduduk keluar 500 orang. Pertambahan penduduknya adalah ...',['1.100 orang','800 orang','1.000 orang','600 orang'],3],
['mc','Kependudukan','Sedang',2,'Bu Sri pindah menetap ke Malaysia untuk bekerja. Sementara itu, Pak Agus mengikuti program transmigrasi dari Jawa ke Kalimantan. Jenis migrasi keduanya secara berurutan adalah ...',['migrasi dalam negeri dan migrasi internasional','migrasi internasional dan migrasi dalam negeri','urbanisasi dan transmigrasi','migrasi internasional dan urbanisasi'],1],
['mc','Kependudukan','Sulit',2,'Kota Sejahtera berpenduduk 20.000 jiwa pada pertengahan tahun 2025. Wanita usia subur (15–49 tahun) di kota itu ada 5.000 orang. Dalam setahun tercatat 250 bayi lahir hidup dan 10 bayi lahir mati. Angka kelahiran umum (GFR) kota tersebut adalah ...',['12,5 per 1.000','20 per 1.000','50 per 1.000','52 per 1.000'],2],
['mc','Kependudukan','Sulit',2,'Di Kabupaten Harapan, selama tahun 2025 lahir hidup 4.000 bayi. Sebanyak 60 bayi meninggal sebelum berumur 1 tahun. Seluruh kematian di kabupaten itu berjumlah 200 orang dari 50.000 penduduk. Angka kematian bayi (IMR) kabupaten tersebut adalah ...',['15 per 1.000 kelahiran hidup','1,2 per 1.000 kelahiran hidup','4 per 1.000 kelahiran hidup','66,7 per 1.000 kelahiran hidup'],0],
['is','Aktivitas Ekonomi','Mudah',3,'Orang atau perusahaan yang menyalurkan barang dari produsen ke konsumen disebut ....',[['distributor']]],
['is','Aktivitas Ekonomi','Mudah',3,'Pedagang yang membeli barang dalam jumlah besar dari produsen lalu menjualnya ke pedagang kecil disebut ....',[['pedagang besar','grosir']]],
['is','Perdagangan Antarpulau','Sedang',3,'Perdagangan di Indonesia diatur dalam Undang-Undang Nomor ... Tahun .... (tulis nomor dan tahun)',[['7'],['2014']]],
['is','Kependudukan','Mudah',3,'Piramida penduduk yang didominasi penduduk usia muda, sehingga bagian bawahnya lebar, disebut piramida penduduk ....',[['ekspansif']]],
['is','Kependudukan','Mudah',3,'Pada rumus P = (L – M) + (I – E), huruf E menunjukkan jumlah penduduk yang keluar atau disebut ....',[['emigrasi']]],
['is','Kependudukan','Sulit',3,'Kota Tirta berpenduduk 40.000 jiwa. Dalam setahun, 1.200 orang datang menetap dan 800 orang pindah ke kota lain. Angka migrasi neto kota itu adalah .... per 1.000 penduduk. (tulis angkanya saja)',[['10']]],
['ur','Aktivitas Ekonomi','Sedang',9,'Jelaskan perbedaan kegiatan produksi, distribusi, dan konsumsi! Berikan masing-masing satu contoh dari kegiatan pembuatan dan penjualan tahu.','Produksi 3, distribusi 3, konsumsi 3 (tiap kegiatan: pengertian 2 + contoh tahu 1). Produksi = menghasilkan, distribusi = menyalurkan, konsumsi = menghabiskan nilai guna.'],
['ur','Perdagangan Antarpulau','Sedang',6,'Sebutkan dan jelaskan 2 tujuan perdagangan antarpulau!','Memperoleh keuntungan 3 + memperluas jangkauan pasar 3 (tiap tujuan: menyebut 1 + penjelasan benar 2).'],
['ur','Perdagangan Antarpulau','Sedang',8,'Sebutkan 3 manfaat perdagangan antarpulau bagi masyarakat, lalu jelaskan salah satunya!','Sebut 3 manfaat = 3 (pilih 3 dari: alternatif pemuas kebutuhan, produktivitas, kesempatan kerja, kemakmuran, IPTEK). Penjelasan satu manfaat: lengkap 5, kurang lengkap 3, hanya mengulang nama 1.'],
['ur','Kependudukan','Sedang',8,'Sebutkan 2 faktor pendorong kelahiran (pro-natalitas) dan 2 faktor penghambat kelahiran (anti-natalitas)!','Pro-natalitas 2 faktor x2 = 4 (kawin usia muda, banyak anak banyak rezeki, anak pencari nafkah, anak penentu status, penerus keturunan). Anti-natalitas 2 faktor x2 = 4 (KB, penundaan usia kawin, perempuan berkarier). Tertukar = 0.'],

async function dv(){RS=await loadRes();const n=RS.length,v=RS.map(nil),tun=v.filter(x=>x>=CFG.kkm).length,avg=n?(v.reduce((a,b)=>a+b,0)/n).toFixed(2):'-';
const ia=B.map((q,i)=>q[0]==='ur'?'':`<tr><td>${i+1}</td><td>${E(q[1])}</td><td>${q[2]}</td><td>${n?Math.round(RS.filter(r=>Math.abs(sc(q,r.ans[i])-q[3])<1e-9).length/n*100)+'%':'-'}</td></tr>`).join('');
app.innerHTML=`<div class="card g"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h2>Dashboard guru · ${E(CFG.sekolah)} · ${E(CFG.mapel)} ${E(CFG.kelas)}</h2><div class="no-p"><button class="b s" data-a="rl">⟳ Muat ulang</button> <button class="b s" data-a="csv">Ekspor CSV</button> <button class="b s" data-a="pt">Cetak</button> <button class="b s" data-a="rst">Hapus data lokal</button> <button class="b" data-a="ex">Keluar</button></div></div>
<div class="g g2"><div><label>Peserta selesai</label><b>${n}</b></div><div><label>Tertinggi</label><b>${n?Math.max(...v):'-'}</b></div><div><label>Terendah</label><b>${n?Math.min(...v):'-'}</b></div><div><label>Rata-rata</label><b>${avg}</b></div><div><label>Ketuntasan (KKM ${CFG.kkm})</label><b>${n?Math.round(tun/n*100)+'%':'-'}</b></div></div>
<small style="color:var(--m)">Statistik memakai nilai sementara bila uraian belum diperiksa. ${DB?'Data bersama (db) aktif.':'Data hanya dari browser ini (db bersama tidak aktif).'}</small>
<div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>PG</th><th>Isian</th><th>Uraian</th><th>Nilai</th><th>Status</th><th>Pel.</th><th>Durasi</th><th></th></tr>${RS.map(r=>`<tr><td>${E(r.nama)}</td><td>${E(r.kelas)}</td><td>${bd(r).pg}</td><td>${bd(r).is}</td><td>${bd(r).ur}</td><td><b>${nil(r)}</b></td><td>${pend(r)?'Sementara':'Final'} · ${nil(r)>=CFG.kkm?'Tuntas':'Belum'}</td><td>${r.pel}</td><td>${F(r.dur/1e3)}</td><td><button class="b s" data-a="pr" data-v="${E(r.id)}">Periksa</button></td></tr>`).join('')||'<tr><td colspan="10">Belum ada data.</td></tr>'}</table></div>
<b>Analisis butir (PG &amp; isian)</b><div class="tw"><table><tr><th>No bank</th><th>Materi</th><th>Tingkat</th><th>% benar</th></tr>${ia}</table></div></div>`}
function pr(id){const r=RS.find(x=>x.id===id);if(!r)return;
md(`<h2>${E(r.nama)} · ${nil(r)}</h2>`+B.map((q,i)=>q[0]!=='ur'?'':`<div style="margin:10px 0"><b>Soal bank #${i+1}</b> (maks ${q[3]})<div style="white-space:pre-line;color:var(--m)">${E(q[4])}</div><pre>${E(r.ans[i]||'(kosong)')}</pre><small><b>Rubrik:</b> ${E(q[5])}</small><br><input type="number" min="0" max="${q[3]}" step="0.5" data-g="${i}" value="${r.ur&&i in r.ur?r.ur[i]:''}" placeholder="Skor 0–${q[3]}" style="width:140px"></div>`).join('')+`<b>Log aktivitas</b><pre>${E((r.log||[]).map(l=>tm(l.t)+'  '+l.m).join('\n'))}</pre><button class="b s" data-a="cm">Tutup</button> <button class="b" data-a="sg" data-v="${E(id)}">Simpan nilai uraian</button>`)}
const csvq=x=>'"'+String(x).replace(/"/g,'""')+'"';
async function csv(){const h=['Nama','Kelas','Skor PG','Skor Isian','Skor Uraian','Nilai','Status Nilai','Benar','Salah','Kosong','Pelanggaran','Durasi (menit)','Status KKM'];
const d='\ufeff'+[h.map(csvq).join(',')].concat(RS.map(r=>[r.nama,r.kelas,bd(r).pg,bd(r).is,bd(r).ur,nil(r),pend(r)?'Sementara':'Final',r.ok,r.sal,r.kos,r.pel,(r.dur/6e4).toFixed(1),nil(r)>=CFG.kkm?'Tuntas':'Belum tuntas'].map(csvq).join(','))).join('\n');
try{const x=await claude.use('downloads');if(x){await x.save({filename:'rekap-nilai-uts.csv',data:d});return}}catch(e){}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d],{type:'text/csv'}));a.download='rekap-nilai-uts.csv';a.click()}
/* ===== AKSI & ROUTER ===== */
const A={
go:v=>{DIR=+v===S.cur?'':(+v>S.cur?'r':'l');S.cur=+v;sv();rq()},pick:v=>{const i=S.ord[S.cur],q=B[i];if(CFG.langsung&&S.ans[i]!==undefined)return;S.ans[i]=+v;sv();rq();if(CFG.langsung&&q[0]==='mc'&&+v===q[6])conf(60,110);else if(!CFG.langsung)$('#bub').textContent=QP[Math.random()*QP.length|0]},fl:()=>{const i=S.ord[S.cur];S.fl[i]=!S.fl[i];sv();rq()},
fin:()=>{const u=S.ord.filter(i=>!ans(i)).length,f=Object.values(S.fl).filter(Boolean).length;md(`<h2>Akhiri ujian?</h2><p>${u?`Masih ada <b>${u}</b> soal belum dijawab. `:'Semua soal sudah dijawab. '}${f?`<b>${f}</b> soal masih ditandai ragu. `:''}Setelah diakhiri, jawaban tidak dapat diubah.</p><button class="b s" data-a="cm">Kembali</button> <button class="b" data-a="ff">Ya, akhiri</button>`)},
ff:()=>fin('Diakhiri peserta'),cm,
fs:()=>{if(document.fullscreenElement){FS=false;document.exitFullscreen()}else document.documentElement.requestFullscreen().then(()=>{FS=true}).catch(()=>{})},
st,dl,ex:()=>{S=null;LS.s('cbt_sess',null);home()},
pl:()=>{if($('#pin').value===CFG.pin)dv();else $('#err').textContent='PIN salah.'},rl:dv,csv,pt:()=>{try{print()}catch(e){}},pr,
rst:()=>md('<h2>Hapus data lokal?</h2><p>Menghapus hasil dan sesi yang tersimpan di browser ini. Data di db bersama tidak ikut terhapus.</p><button class="b s" data-a="cm">Batal</button> <button class="b" data-a="rs2">Hapus</button>'),
rs2:()=>{LS.s('cbt_res',{});LS.s('cbt_sess',null);cm();dv()},
sg:async v=>{const r=RS.find(x=>x.id===v);r.ur=r.ur||{};document.querySelectorAll('[data-g]').forEach(el=>{if(el.value!=='')r.ur[el.dataset.g]=Math.min(Math.max(+el.value||0,0),B[el.dataset.g][3])});await saveRes(r);cm();dv()}};
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');b&&A[b.dataset.a]&&A[b.dataset.a](b.dataset.v)});
document.addEventListener('click',e=>{const b=e.target.closest('.md [data-a]');b&&A[b.dataset.a]&&A[b.dataset.a](b.dataset.v)});
document.addEventListener('input',e=>{const i=e.target.dataset&&e.target.dataset.i;if(i!==undefined&&S&&!S.done&&inExam){S.ans[i]=e.target.value;sv();nav()}});
(function(){const R=LS.g('cbt_res',{});if(S&&S.done){R[S.id]?result(R[S.id]):home();return}
if(S){if(Date.now()>=S.end){inExam=true;fin('Waktu habis');return}lg('Halaman dimuat ulang, sesi dipulihkan');begin();return}
home()})();
/* ===== LATAR: PARTIKEL ===== */
(function(){const c=$('#cv'),x=c.getContext('2d');let W,Y,P=[];function rs(){W=c.width=innerWidth;Y=c.height=innerHeight;P=Array.from({length:Math.min(80,W/14|0)},()=>({x:Math.random()*W,y:Math.random()*Y,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*3+1.5,h:Math.random()*360}))}rs();addEventListener('resize',rs);
(function d(){x.clearRect(0,0,W,Y);const k=matchMedia('(prefers-color-scheme:dark)').matches?'165,180,252':'79,70,229';P.forEach((p,i)=>{p.h=(p.h+.5)%360;p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+Y)%Y;x.fillStyle=`hsla(${p.h},90%,62%,.75)`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();for(let j=i+1;j<P.length;j++){const q=P[j],z=Math.hypot(p.x-q.x,p.y-q.y);if(z<110){x.strokeStyle=`hsla(${p.h},90%,62%,${.3*(1-z/110)})`;x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);x.stroke()}}});requestAnimationFrame(d)})()})();
</script></body></html>
